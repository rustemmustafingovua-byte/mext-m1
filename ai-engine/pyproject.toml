[project]
name = "mext-ai"
version = "0.4.0"
description = "MEXT-M1 AI engine: MLX layer streamer + zero-RAM LanceDB RAG"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.29",
    "lancedb>=0.20",
    "numpy>=1.26",
    "pyarrow>=15",
    "psutil>=5.9",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
real-model = ["mlx-lm>=0.20", "huggingface_hub>=0.24"]
dev = ["pytest>=8"]

[project.scripts]
mext-ai = "mext_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mext_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
