name: Bug report
description: Something does not behave as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `mext doctor` and attach its output —
        it answers most environment questions in one shot.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mext start --workspace ... --ram-limit 2G
        2. open http://localhost:8765
        3. ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MEXT version
      placeholder: mext 0.6.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.2 · Apple M1 · 8 GB
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: mext doctor
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "`~/.mext/mext.log` (redact anything private)."
      render: shell
