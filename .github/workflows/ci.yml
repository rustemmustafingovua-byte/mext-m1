name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: rust + python + e2e (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            core-daemon/target
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('core-daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python package
        run: python -m pip install -e "ai-engine[dev,pdf]"

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path core-daemon/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path core-daemon/Cargo.toml --all-targets -- -D warnings

      - name: Ruff
        run: python -m ruff check ai-engine/mext_ai ai-engine/tests

      - name: Run Rust tests
        run: cargo test --manifest-path core-daemon/Cargo.toml

      - name: Check dashboard JavaScript
        run: |
          if command -v node >/dev/null 2>&1; then
            node --check dashboard/app.js
          else
            echo "node not available, skipping dashboard/app.js check"
          fi

      - name: Run Python tests
        run: pytest ai-engine -q

      - name: e2e (Rust core, CLI + HTTP)
        run: make e2e

      - name: e2e (MLX neural loader + LanceDB RAG)
        run: make e2e-ai

      - name: AI engine selftest
        run: |
          if python -c "import mlx" >/dev/null 2>&1; then
            mext-ai selftest
          else
            echo "mlx not available, skipping mext-ai selftest"
          fi

      - name: Upload mext logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mext-logs
          path: ~/.mext/mext.log
