name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build + publish macOS arm64 artefacts
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            core-daemon/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('core-daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-

      - name: Build release binaries
        run: cargo build --release --manifest-path core-daemon/Cargo.toml

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="mext-m1-${TAG}-aarch64-apple-darwin"
          mkdir -p "dist/${NAME}"
          cp core-daemon/target/release/mext "dist/${NAME}/"
          cp core-daemon/target/release/mextd "dist/${NAME}/"
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          shasum -a 256 "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"
          ls -lh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 \
            --generate-notes \
            --title "MEXT-M1 ${TAG}" \
            --verify-tag
